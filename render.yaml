services:
  - type: worker
    name: binance-orderflow-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_SYMBOL
        value: btcusdt
      - key: BOT_MARKET_SYMBOL
        value: BTCUSDT
      - key: BOT_STORAGE_DIR
        value: /var/data/storage
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BOT_SIGNAL_COOLDOWN_SECONDS
        value: "900"
      - key: BOT_MIN_REPEAT_PRICE_CHANGE
        value: "0"
      - key: LOG_LEVEL
        value: DEBUG
      - key: BOT_LOG_THROTTLE_SECONDS
        value: "0"
      - key: BOT_BUFFER_LOG_INTERVAL_SECONDS
        value: "0"
      - key: BOT_NO_MATCH_WARN_THROTTLE_SECONDS
        value: "0"
      - key: BOT_PERSIST_RAW_EVENTS
        value: "false"
